apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts  # OCI, без префикса oci://
      chart: wordpress
      targetRevision: 34.2.12  # зафиксированная версия чарта
      helm:
        valueFiles:
          - $values/apps/wordpress/values.yaml
    - repoURL: https://github.com/Sater1917/argocdwp.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
